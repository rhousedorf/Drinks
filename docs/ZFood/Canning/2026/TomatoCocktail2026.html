    <style>
        html {
            /* Prevents smartphones from randomly auto-sizing fonts, keeping control in your CSS */
            -webkit-text-size-adjust: none;

            overflow-wrap: break-word; /* Prevents long text from spilling out */

            /* Fluid text: Sets a minimum size of 1.25rem (20px), scales

            font-size: clamp(1.0rem, 3vw + 0.5rem, 2.0rem);
            line-height: 1.6;
            padding: 1.5rem;
            box-sizing: border-box;
        }
    </style>

</head>
